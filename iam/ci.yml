---
.iam:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "iam/**/*"
    DIR_PATH: "iam"

code-quality-iam-terraform-lint:
  extends: [.iam, .terraform_lint]

code-quality-iam-terraform-fmt:
  extends: [.iam, .terraform_fmt]

code-quality-iam-yaml-lint:
  extends: [.iam, .yaml_lint]

validate-syntax-iam:
  extends: [.iam, .validate_syntax]

validate-security-iam:
  extends: [.iam, .validate_security]


build-iam:
  stage: build_sg_iam
  rules:
    - if: $RULES_CHANGES_PATH != "iam/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.iam, .plan]

deploy-iam:
  stage: deploy_sg_iam
  rules:
    - if: $RULES_CHANGES_PATH != "iam/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.iam, .apply]
  #needs: ["build-iam"]

destroy-iam:
  stage: destroy_sg_iam
  rules:
    - if: $RULES_CHANGES_PATH != "iam/**/*"
      when: never
    - !reference [.destroy, rules]
    - !reference [.base-rules, rules]
  extends: [.iam, .destroy]
  needs: ["deploy-iam"]
