---
.eks:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "eks/**/*"
    DIR_PATH: "eks"

code-quality-eks-terraform-lint:
  extends: [.eks, .terraform_lint]

code-quality-eks-terraform-fmt:
  extends: [.eks, .terraform_fmt]

code-quality-eks-yaml-lint:
  extends: [.eks, .yaml_lint]

validate-syntax-eks:
  extends: [.eks, .validate_syntax]

validate-security-eks:
  extends: [.eks, .validate_security]

build-eks:
  stage: build_eks
  rules:
    - if: $RULES_CHANGES_PATH != "eks/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.eks, .plan]

deploy-eks:
  stage: deploy_eks
  rules:
    - if: $RULES_CHANGES_PATH != "eks/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.eks, .apply]
  #needs: ["build-eks"]

destroy-eks:
  stage: destroy_eks
  rules:
    - if: $RULES_CHANGES_PATH != "eks/**/*"
      when: never
    - !reference [.destroy, rules]
    - !reference [.base-rules, rules]
  extends: [.eks, .destroy]
  needs: ["deploy-eks"]
