---
.helm:
  extends: .base-rules
  variables:
    RULES_CHANGES_PATH: "helm/**/*"
    DIR_PATH: "helm"

code-quality-helm-terraform-lint:
  extends: [.helm, .terraform_lint]

code-quality-helm-terraform-fmt:
  extends: [.helm, .terraform_fmt]

code-quality-helm-yaml-lint:
  extends: [.helm, .yaml_lint]

validate-syntax-helm:
  extends: [.helm, .validate_syntax]

validate-security-helm:
  extends: [.helm, .validate_security]

validate-security-checkov-helm:
  extends: [.helm, .validate_security_checkov]

build-helm:
  stage: build_helm
  rules:
    - if: $RULES_CHANGES_PATH != "helm/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.helm, .plan]

deploy-helm:
  stage: deploy_helm
  rules:
    - if: $RULES_CHANGES_PATH != "helm/**/*"
      when: never
    - !reference [.base-rules, rules]
  extends: [.helm, .apply]
  #needs: ["build-helm"]

destroy-helm:
  stage: destroy_helm
  rules:
    - if: $RULES_CHANGES_PATH != "helm/**/*"
      when: never
    - !reference [.destroy, rules]
    - !reference [.base-rules, rules]
  extends: [.helm, .destroy]
  needs: ["deploy-helm"]
